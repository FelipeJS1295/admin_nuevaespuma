server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # API: /api/ventas -> backend:3333/ventas
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3333;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Archivos con nombre único: se pueden guardar en caché por mucho tiempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index nunca se guarda en caché, para que las actualizaciones se vean al tiro
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas de la aplicación (/clientes/5, /informes, etc.): siempre devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}